<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для Эльмиры ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;

        background:
            radial-gradient(circle at 20% 20%, rgba(150, 35, 70, .25), transparent 35%),
            radial-gradient(circle at 80% 80%, rgba(220, 90, 130, .15), transparent 35%),
            linear-gradient(135deg, #12070d, #281019 50%, #10060b);

        color: #f9e8ed;
        font-family: "Cormorant Garamond", serif;
        overflow: hidden;
    }

    /* мягкие светящиеся точки */
    body::before,
    body::after {
        content: "♥";
        position: fixed;
        color: rgba(255, 150, 180, .15);
        font-size: 180px;
        filter: blur(2px);
        pointer-events: none;
    }

    body::before {
        top: -70px;
        left: -40px;
        transform: rotate(-20deg);
    }

    body::after {
        bottom: -90px;
        right: -40px;
        transform: rotate(20deg);
    }

    .card {
        position: relative;
        width: min(760px, 100%);
        padding: 55px 45px 50px;

        text-align: center;

        background: rgba(30, 10, 18, .72);
        border: 1px solid rgba(255, 180, 200, .25);
        border-radius: 28px;

        box-shadow:
            0 30px 80px rgba(0, 0, 0, .6),
            0 0 60px rgba(160, 35, 75, .12);

        backdrop-filter: blur(14px);

        animation: appear 1.8s ease forwards;
    }

    .heart {
        font-size: 38px;
        color: #e58ba6;
        margin-bottom: 5px;
        animation: heartbeat 2s infinite;
        text-shadow: 0 0 20px rgba(255, 100, 140, .5);
    }

    h1 {
        font-family: "Great Vibes", cursive;
        font-size: clamp(55px, 10vw, 90px);
        font-weight: 400;
        color: #f6b8ca;
        margin-bottom: 30px;

        text-shadow:
            0 0 15px rgba(255, 130, 165, .3),
            0 5px 20px rgba(0, 0, 0, .5);
    }

    .line {
        width: 90px;
        height: 1px;
        margin: 0 auto 32px;

        background: linear-gradient(
            90deg,
            transparent,
            #d98aa2,
            transparent
        );
    }

    .poem {
        font-size: clamp(23px, 4vw, 30px);
        line-height: 1.55;
        font-weight: 500;
        letter-spacing: .3px;
    }

    .poem p {
        margin-bottom: 25px;
    }

    .poem .highlight {
        color: #f3a9bd;
        font-style: italic;
    }

    .ending {
        margin-top: 35px;
        font-size: 19px;
        letter-spacing: 2px;
        color: rgba(249, 232, 237, .65);
    }

    .signature {
        margin-top: 15px;
        font-family: "Great Vibes", cursive;
        font-size: 38px;
        color: #e99ab0;
    }

    /* плавающие сердечки */
    .floating-heart {
        position: fixed;
        bottom: -30px;
        font-size: 18px;
        color: rgba(240, 120, 150, .45);
        animation: floatUp linear infinite;
        pointer-events: none;
    }

    .h1 { left: 12%; animation-duration: 9s; }
    .h2 { left: 30%; animation-duration: 12s; animation-delay: 3s; }
    .h3 { left: 70%; animation-duration: 10s; animation-delay: 1s; }
    .h4 { left: 88%; animation-duration: 14s; animation-delay: 5s; }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(25px) scale(.97);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.15);
        }
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 0;
        }

        15% {
            opacity: 1;
        }

        100% {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }

    @media (max-width: 600px) {
        .card {
            padding: 40px 22px;
            border-radius: 22px;
        }

        .poem {
            font-size: 22px;
        }

        .ending {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="floating-heart h1">♥</div>
<div class="floating-heart h2">♡</div>
<div class="floating-heart h3">♥</div>
<div class="floating-heart h4">♡</div>

<div class="card">

    <div class="heart">♥</div>

    <h1>Эльмира</h1>

    <div class="line"></div>

    <div class="poem">

        <p>
            Красота твоя бездонна,<br>
            Раз увидел — и пропал,<br>
            Манит стан прекрасный, томный,<br>
            Ясного лица овал.
        </p>

        <p>
            Взгляд, как омут, поглощает,<br>
            Губы алые влекут,<br>
            И черты лица, красотка,<br>
            <span class="highlight">В плен сладчайший свой берут.</span>
        </p>

    </div>

    <div class="ending">
        Вот такие дела, Эльмира )))
        <br>
        Вот тебе и типа сайт))))
    </div>

    <div class="signature">
        ❤️
    </div>

</div>

</body>
</html>
